      name="description"
      content="Open in the browser with no install. Use Chrome on-device AI, Ollama / LM Studio locally, or any OpenAI-compatible API. Chats stay in your browser."
    />

      name="keywords"
      content="ChatGUI,local LLM,Ollama,LM Studio,browser AI,OpenRouter,OpenAI compatible"
    />
    <meta name="application-name" content="ChatGUI" />
    <meta name="theme-color" content="#0e1015" />
    <link rel="canonical" href="https://chatgui.org/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChatGUI" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://chatgui.org/" />
    <meta property="og:title" content="ChatGUI — Minimal chat for browser, local &amp; API models" />
    <meta
      property="og:description"
      content="Open in the browser with no install. Use Chrome on-device AI, Ollama / LM Studio locally, or any OpenAI-compatible API."
    />
    <meta property="og:image" content="https://chatgui.org/favicon.svg" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ChatGUI — Minimal chat for browser, local &amp; API models" />
    <meta
      name="twitter:description"
      content="Open in the browser with no install. Use on-device browser AI, local models, or OpenAI-compatible APIs."
    />
    <meta name="twitter:image" content="https://chatgui.org/favicon.svg" />

    <script>
      try {
        var t = localStorage.getItem("chatgui_theme") || "dark";
        var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
      // Recover path after GitHub Pages 404.html redirect (?/about → /about)
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
